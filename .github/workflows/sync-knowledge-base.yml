name: Sync AI Knowledge Base

on:
  push:
    branches:
      - main
      - claude/kind-bardeen-rKhPC
    paths:
      - 'CLAUDE.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if CLAUDE.md unchanged'
        required: false
        default: 'false'

jobs:
  sync:
    name: Extract & upsert knowledge sections
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-knowledge-base.mjs
